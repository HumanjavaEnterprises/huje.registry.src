# RELEASE TRAIN (2026-07): versions below reflect the coordinated 2026-07
# correctness + security-hardening release train (adversarial multi-agent audit;
# family-wide fixes verified against a shared KAT vector spine — NIP-44 v2 /
# NIP-49 / NIP-19 TLV / BIP-340). The fixes are STAGED on git branches and merged
# main; npm/PyPI publish is OTP-gated and IMMINENT but NOT yet done — treat these
# numbers as the release-of-record set, not proof the tarball is already on the
# registry. Kernel-first publish order + full detail: audit/RELEASE-RUNBOOK.md
# and audit/release-fix-plan-2026-07-17.md.

